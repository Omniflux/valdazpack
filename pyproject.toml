[project]
name = "valdazpack"
version = "0.1.1"
description = "DAZ Package Validator"
license = "MIT"
authors = [
    { name = "Omni Flux", email = "omniflux@omniflux.com" },
]
readme = "README.rst"
classifiers = [
	"Development Status :: 3 - Alpha",
	"Environment :: Console",
	"Operating System :: OS Independent",
	"Programming Language :: Python :: 3 :: Only",
	"Topic :: Utilities"
]
requires-python = "~=3.11.9"
dependencies = [
	"fs (>=2.4.16)",
	"fs.dimzipfs (>=0.1.2)",
	"fs.wrapcifs (>=0.1.0)",
	"jinja2 (>=3.1.6)",
	"jsonschema[format] (>=4.26.0)",
	"lxml (>=6.1.2)",
	"numpy (>=2.4.6)",
	"Pillow (>=12.2.0)",
	"python-jsonpath (>=2.2.1)"
]

[project.urls]
repository = "https://github.com/Omniflux/valdazpack"
issues = "https://github.com/Omniflux/valdazpack/issues"

[project.scripts]
valdazpack = "valdazpack.__main__:_main"

[build-system]
requires = ["poetry-core (>=1.0.0)"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
typing = [
	"types-lxml (>=2026.2.16)",
	"types-jsonschema (>=4.26.0.20260518)"
]
test = [
    "pytest (>=9.1.1)",
    "pytest-mock (>=3.15.1)"
]
